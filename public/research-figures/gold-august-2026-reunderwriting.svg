<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Gold real-yield invalidation and revised demand evidence">
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.22"/></filter>
<linearGradient id="greenFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#65e3a2" stop-opacity="0.42"/><stop offset="1" stop-color="#65e3a2" stop-opacity="0.04"/></linearGradient>
<linearGradient id="blueFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fb7de" stop-opacity="0.42"/><stop offset="1" stop-color="#8fb7de" stop-opacity="0.04"/></linearGradient>
</defs>
<rect width="100%" height="100%" rx="24" fill="#07111b"/>
<rect x="1" y="1" width="1198" height="698" rx="23" fill="none" stroke="#274052"/>
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#9db0bd;font-size:18px}.small{fill:#9db0bd;font-size:15px}.value{fill:#eef8f3;font-size:20px;font-weight:650}.axis{stroke:#274052;stroke-width:1}.headline{fill:#eef8f3;font-size:22px;font-weight:650}.note{fill:#9db0bd;font-size:16px}</style>
<text class="headline" x="70" y="54">Real-yield invalidation</text>
<text class="small" x="70" y="78">US 10-year TIPS yield, selected observations</text>
<line class="axis" x1="90" y1="555.0" x2="590" y2="555.0" opacity="0.55"/>
<text class="small" x="76" y="560.0" text-anchor="end">1.6%</text>
<line class="axis" x1="90" y1="469.0" x2="590" y2="469.0" opacity="0.55"/>
<text class="small" x="76" y="474.0" text-anchor="end">1.8%</text>
<line class="axis" x1="90" y1="383.0" x2="590" y2="383.0" opacity="0.55"/>
<text class="small" x="76" y="388.0" text-anchor="end">2.0%</text>
<line class="axis" x1="90" y1="297.0" x2="590" y2="297.0" opacity="0.55"/>
<text class="small" x="76" y="302.0" text-anchor="end">2.2%</text>
<line class="axis" x1="90" y1="211.0" x2="590" y2="211.0" opacity="0.55"/>
<text class="small" x="76" y="216.0" text-anchor="end">2.4%</text>
<line class="axis" x1="90" y1="125.0" x2="590" y2="125.0" opacity="0.55"/>
<text class="small" x="76" y="130.0" text-anchor="end">2.6%</text>
<line x1="90" y1="318.5" x2="590" y2="318.5" stroke="#f29a9a" stroke-width="3" stroke-dasharray="10 9"/>
<text class="small" x="585" y="306.5" text-anchor="end" fill="#f29a9a">2.15% invalidation</text>
<path d="M 90.0 430.3 L 340.0 232.5 L 590.0 236.8" fill="none" stroke="#f4c978" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="90.0" cy="430.3" r="8" fill="#07111b" stroke="#f4c978" stroke-width="4"/>
<text class="value" x="90.0" y="412.3" text-anchor="middle">1.89%</text>
<text class="label" x="90.0" y="593" text-anchor="middle">5 Feb</text>
<circle cx="340.0" cy="232.5" r="8" fill="#07111b" stroke="#f4c978" stroke-width="4"/>
<text class="value" x="340.0" y="214.5" text-anchor="middle">2.35%</text>
<text class="label" x="340.0" y="593" text-anchor="middle">16 Jul</text>
<circle cx="590.0" cy="236.8" r="8" fill="#07111b" stroke="#f4c978" stroke-width="4"/>
<text class="value" x="590.0" y="218.8" text-anchor="middle">2.34%</text>
<text class="label" x="590.0" y="593" text-anchor="middle">26 Aug</text>
<line x1="625" y1="90" x2="625" y2="620" stroke="#274052"/>
<text class="headline" x="680" y="54">Demand signals improved</text>
<text class="small" x="680" y="78">Tonnes; central-bank demand and ETF flow</text>
<rect x="680" y="471.1" width="120" height="68.9" rx="9" fill="#8fb7de"/>
<text class="value" x="740.0" y="453.1" text-anchor="middle">56.5t</text>
<text class="label" x="740.0" y="578" text-anchor="middle">Q1 CB</text>
<rect x="830" y="187.9" width="120" height="352.1" rx="9" fill="#65e3a2"/>
<text class="value" x="890.0" y="169.9" text-anchor="middle">288.9t</text>
<text class="label" x="890.0" y="578" text-anchor="middle">Q2 CB</text>
<rect x="980" y="512.0" width="120" height="28.0" rx="9" fill="#b6a2ff"/>
<text class="value" x="1040.0" y="494.0" text-anchor="middle">23t</text>
<text class="label" x="1040.0" y="578" text-anchor="middle">Jul ETF</text>
<text class="note" x="680" y="615">Q1 was revised sharply lower; Q2 official demand and</text>
<text class="note" x="680" y="643">July ETF flows then recovered.</text>
</svg>
