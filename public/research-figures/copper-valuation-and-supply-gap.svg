<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Copper price context, preferred entry band and refined balance forecasts">
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.22"/></filter>
<linearGradient id="greenFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#65e3a2" stop-opacity="0.42"/><stop offset="1" stop-color="#65e3a2" stop-opacity="0.04"/></linearGradient>
<linearGradient id="blueFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fb7de" stop-opacity="0.42"/><stop offset="1" stop-color="#8fb7de" stop-opacity="0.04"/></linearGradient>
</defs>
<rect width="100%" height="100%" rx="24" fill="#07111b"/>
<rect x="1" y="1" width="1198" height="698" rx="23" fill="none" stroke="#274052"/>
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#9db0bd;font-size:18px}.small{fill:#9db0bd;font-size:15px}.value{fill:#eef8f3;font-size:20px;font-weight:650}.axis{stroke:#274052;stroke-width:1}.headline{fill:#eef8f3;font-size:22px;font-weight:650}.note{fill:#9db0bd;font-size:16px}</style>
<text class="headline" x="70" y="54">Price context and entry discipline</text>
<text class="small" x="70" y="78">US dollars per tonne</text>
<line class="axis" x1="90" y1="555.0" x2="590" y2="555.0" opacity="0.55"/>
<text class="small" x="76" y="560.0" text-anchor="end">$10k</text>
<line class="axis" x1="90" y1="476.8" x2="590" y2="476.8" opacity="0.55"/>
<text class="small" x="76" y="481.8" text-anchor="end">$11k</text>
<line class="axis" x1="90" y1="398.6" x2="590" y2="398.6" opacity="0.55"/>
<text class="small" x="76" y="403.6" text-anchor="end">$12k</text>
<line class="axis" x1="90" y1="320.5" x2="590" y2="320.5" opacity="0.55"/>
<text class="small" x="76" y="325.5" text-anchor="end">$13k</text>
<line class="axis" x1="90" y1="242.3" x2="590" y2="242.3" opacity="0.55"/>
<text class="small" x="76" y="247.3" text-anchor="end">$14k</text>
<line class="axis" x1="90" y1="164.1" x2="590" y2="164.1" opacity="0.55"/>
<text class="small" x="76" y="169.1" text-anchor="end">$15k</text>
<rect x="90" y="359.5" width="500" height="58.6" fill="#65e3a2" opacity="0.18"/>
<text class="small" x="582" y="349.5" text-anchor="end">Preferred entry: $11,750–12,500</text>
<line x1="152.5" y1="555" x2="152.5" y2="398.6" stroke="#8fb7de" stroke-width="7" stroke-linecap="round"/>
<circle cx="152.5" cy="398.6" r="9" fill="#07111b" stroke="#8fb7de" stroke-width="4"/>
<text class="value" x="152.5" y="380.6" text-anchor="middle">$12,000</text>
<text class="label" x="152.5" y="593" text-anchor="middle">Dec 2025</text>
<line x1="277.5" y1="555" x2="277.5" y2="203.2" stroke="#f4c978" stroke-width="7" stroke-linecap="round"/>
<circle cx="277.5" cy="203.2" r="9" fill="#07111b" stroke="#f4c978" stroke-width="4"/>
<text class="value" x="277.5" y="185.2" text-anchor="middle">$14,500</text>
<text class="label" x="277.5" y="593" text-anchor="middle">Jan high</text>
<line x1="402.5" y1="555" x2="402.5" y2="279.3" stroke="#65e3a2" stroke-width="7" stroke-linecap="round"/>
<circle cx="402.5" cy="279.3" r="9" fill="#07111b" stroke="#65e3a2" stroke-width="4"/>
<text class="value" x="402.5" y="261.3" text-anchor="middle">$13,526</text>
<text class="label" x="402.5" y="593" text-anchor="middle">17 Jul</text>
<line x1="527.5" y1="555" x2="527.5" y2="214.9" stroke="#b6a2ff" stroke-width="7" stroke-linecap="round"/>
<circle cx="527.5" cy="214.9" r="9" fill="#07111b" stroke="#b6a2ff" stroke-width="4"/>
<text class="value" x="527.5" y="196.9" text-anchor="middle">$14,350</text>
<text class="label" x="527.5" y="593" text-anchor="middle">27 Aug</text>
<line x1="625" y1="90" x2="625" y2="620" stroke="#274052"/>
<text class="headline" x="680" y="54">Refined balance forecasts</text>
<text class="small" x="680" y="78">ICSG surplus, thousand tonnes</text>
<rect x="720" y="446.4" width="150" height="93.6" rx="9" fill="#8fb7de"/>
<text class="value" x="795.0" y="428.4" text-anchor="middle">96kt</text>
<text class="label" x="795.0" y="578" text-anchor="middle">2026</text>
<rect x="940" y="172.4" width="150" height="367.6" rx="9" fill="#b6a2ff"/>
<text class="value" x="1015.0" y="154.4" text-anchor="middle">377kt</text>
<text class="label" x="1015.0" y="578" text-anchor="middle">2027</text>
<text class="note" x="680" y="615">The long-run mine-supply gap remains material, but</text>
<text class="note" x="680" y="643">near-term refined surpluses constrain the tactical case.</text>
</svg>
